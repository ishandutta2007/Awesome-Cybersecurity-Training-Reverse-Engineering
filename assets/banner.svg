<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#0d1b2a" />
      <stop offset="80%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.05" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d2d50" stroke-width="0.7" opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#00f2fe" opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.02); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(460px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .bg-grid { opacity: 0.7; }
    .scan-line { animation: scanline 8s linear infinite; }
    .data-flow { stroke-dasharray: 20, 20; animation: flowLine 12s linear infinite; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 2.5s; }
    .floating-pill-1 { animation: pillFloat1 4s ease-in-out infinite; }
    .floating-pill-2 { animation: pillFloat2 4.5s ease-in-out infinite 0.5s; }
    .floating-pill-3 { animation: pillFloat1 5s ease-in-out infinite 1s; }

    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" class="bg-grid" />

  <!-- Animated Background Scanline Effect -->
  <g opacity="0.15">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#cyberCyan)" stroke-width="2" class="scan-line" filter="url(#glow)" />
  </g>

  <!-- Dynamic Circuit Background Lines (Far Background) -->
  <g opacity="0.35" stroke="#1f4068" stroke-width="1.5" fill="none">
    <path d="M 60 40 L 220 40 L 280 100 L 460 100" class="data-flow" />
    <path d="M 740 380 L 880 380 L 940 320 L 1140 320" class="data-flow" />
    <path d="M 1000 60 L 1080 140 L 1140 140" />
    <path d="M 120 360 L 180 300 L 320 300" />
  </g>

  <!-- Ambient Glowing Radial Highlights -->
  <circle cx="200" cy="210" r="180" fill="#00f2fe" opacity="0.06" filter="url(#glow)" />
  <circle cx="1020" cy="200" r="200" fill="#00ff87" opacity="0.05" filter="url(#glow)" />
  <circle cx="600" cy="180" r="220" fill="#4facfe" opacity="0.04" filter="url(#glow)" />

  <!-- Dynamic Floating Decorative Particles (Background) -->
  <circle cx="160" cy="120" r="3" fill="#00f2fe" class="particle-1" />
  <circle cx="260" cy="310" r="2.5" fill="#00ff87" class="particle-2" />
  <circle cx="950" cy="90" r="3.5" fill="#60efff" class="particle-3" />
  <circle cx="1060" cy="310" r="2" fill="#00f2fe" class="particle-1" />
  <circle cx="600" cy="50" r="2" fill="#4facfe" class="particle-2" />

  <!-- Foreground Title and Center Information -->
  <!-- Header Tag / Pill -->
  <g transform="translate(450, 48)">
    <rect width="300" height="32" rx="16" fill="#112240" stroke="#00f2fe" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="16" r="4" fill="#00ff87" filter="url(#softGlow)" />
    <text x="36" y="21" fill="#60efff" class="badge-text">CYBERSECURITY LABS &amp; TOOLCHAINS</text>
  </g>

  <!-- Main Headline Title (Crisp, High Contrast Foreground) -->
  <text x="600" y="145" text-anchor="middle" fill="#ffffff" font-size="44" class="brand-title">
    Cybersecurity Training &amp; Reverse Engineering
  </text>
  <text x="600" y="185" text-anchor="middle" fill="url(#neonGreen)" font-size="20" font-weight="600" class="brand-subtitle" letter-spacing="1.2">
    ENTERPRISE CYBER RANGES &bull; DYNAMIC DECOMPILERS &bull; ACTIVE THREAT LABS
  </text>

  <!-- Subtitle Narrative -->
  <text x="600" y="222" text-anchor="middle" fill="#94a3b8" font-size="16" class="brand-subtitle">
    Curated SaaS Platforms, Self-Hosted Labs, Malware Sandboxes, and RE Toolsets
  </text>

  <!-- Dynamic Feature Badges / Interactive Pills (Positioned in Bottom Half) -->
  <g transform="translate(130, 260)">
    <!-- Pill 1: Cyber Ranges -->
    <g transform="translate(0, 0)" class="floating-pill-1">
      <rect width="210" height="74" rx="12" fill="#0c192c" stroke="#1e3a5f" stroke-width="1.5" />
      <rect width="210" height="74" rx="12" fill="url(#shieldGrad)" />
      <circle cx="36" cy="37" r="16" fill="#132f4c" />
      <text x="36" y="42" text-anchor="middle" font-size="16">🛡️</text>
      <text x="64" y="32" fill="#ffffff" font-size="14" font-weight="700" class="brand-title">Cyber Ranges</text>
      <text x="64" y="52" fill="#64748b" font-size="11" class="brand-subtitle">Live-Fire SOC &amp; Blue Team</text>
    </g>

    <!-- Pill 2: Reverse Engineering -->
    <g transform="translate(245, 0)" class="floating-pill-2">
      <rect width="210" height="74" rx="12" fill="#0c192c" stroke="#1e3a5f" stroke-width="1.5" />
      <rect width="210" height="74" rx="12" fill="url(#shieldGrad)" />
      <circle cx="36" cy="37" r="16" fill="#132f4c" />
      <text x="36" y="42" text-anchor="middle" font-size="16">⚡</text>
      <text x="64" y="32" fill="#ffffff" font-size="14" font-weight="700" class="brand-title">Reverse Eng.</text>
      <text x="64" y="52" fill="#64748b" font-size="11" class="brand-subtitle">Ghidra &bull; x64dbg &bull; Radare</text>
    </g>

    <!-- Pill 3: Hands-On Labs -->
    <g transform="translate(490, 0)" class="floating-pill-3">
      <rect width="210" height="74" rx="12" fill="#0c192c" stroke="#1e3a5f" stroke-width="1.5" />
      <rect width="210" height="74" rx="12" fill="url(#shieldGrad)" />
      <circle cx="36" cy="37" r="16" fill="#132f4c" />
      <text x="36" y="42" text-anchor="middle" font-size="16">🎯</text>
      <text x="64" y="32" fill="#ffffff" font-size="14" font-weight="700" class="brand-title">Hands-On Labs</text>
      <text x="64" y="52" fill="#64748b" font-size="11" class="brand-subtitle">HTB &bull; OffSec &bull; CTFd</text>
    </g>

    <!-- Pill 4: Threat Simulation -->
    <g transform="translate(735, 0)" class="floating-pill-1">
      <rect width="210" height="74" rx="12" fill="#0c192c" stroke="#1e3a5f" stroke-width="1.5" />
      <rect width="210" height="74" rx="12" fill="url(#shieldGrad)" />
      <circle cx="36" cy="37" r="16" fill="#132f4c" />
      <text x="36" y="42" text-anchor="middle" font-size="16">🔬</text>
      <text x="64" y="32" fill="#ffffff" font-size="14" font-weight="700" class="brand-title">Emulation &amp; DFIR</text>
      <text x="64" y="52" fill="#64748b" font-size="11" class="brand-subtitle">CALDERA &bull; Volatility &bull; capa</text>
    </g>
  </g>

  <!-- Subtle Bottom Status Strip -->
  <g transform="translate(0, 385)">
    <line x1="40" y1="0" x2="1160" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="600" y="22" text-anchor="middle" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      🔒 Open-Source Verified &bull; Industry-Standard SaaS &bull; Continuously Curated &bull; MITRE ATT&amp;CK Mapped
    </text>
  </g>
</svg>
