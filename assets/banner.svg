<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#0d1b2a" />
      <stop offset="80%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112240" />
      <stop offset="100%" stop-color="#0a1526" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </linearGradient>

    <!-- Clean Grid Pattern (No SVG filters) -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d2d50" stroke-width="0.8" opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#00f2fe" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes scanlineAnim {
      0% { transform: translateY(-50px); }
      100% { transform: translateY(440px); }
    }
    @keyframes pulseOpacity {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.75; }
    }
    @keyframes flowAnim {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes particleFade {
      0%, 100% { opacity: 0.2; transform: translateY(0px); }
      50% { opacity: 0.9; transform: translateY(-12px); }
    }
    @keyframes badgeFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes badgeFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(5px); }
    }

    .scan-beam { animation: scanlineAnim 7s linear infinite; }
    .pulse-glow { animation: pulseOpacity 4s ease-in-out infinite; }
    .circuit-data { stroke-dasharray: 12, 12; animation: flowAnim 10s linear infinite; }
    .particle-anim1 { animation: particleFade 4s ease-in-out infinite; }
    .particle-anim2 { animation: particleFade 5s ease-in-out infinite 1.5s; }
    .card-float1 { animation: badgeFloat1 4.5s ease-in-out infinite; }
    .card-float2 { animation: badgeFloat2 5s ease-in-out infinite 0.7s; }

    .brand-title {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
    }
    .brand-subtitle {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .badge-label {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="14" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="14" fill="url(#cyberGrid)" />

  <!-- Animated Glowing Scanline (Strictly vector gradient line, no filters) -->
  <g class="scan-beam">
    <line x1="60" y1="0" x2="1140" y2="0" stroke="url(#scanlineGrad)" stroke-width="2.5" />
  </g>

  <!-- Background Data Flow Circuit Lines -->
  <g stroke="#1e3a5f" stroke-width="1.5" fill="none" opacity="0.45">
    <path d="M 50 40 L 220 40 L 270 90 L 450 90" class="circuit-data" />
    <path d="M 750 360 L 920 360 L 970 310 L 1150 310" class="circuit-data" />
    <path d="M 980 50 L 1050 120 L 1140 120" />
    <path d="M 60 360 L 130 290 L 240 290" />
  </g>

  <!-- Ambient Light Halos (Pure radial gradients/opacities, zero filters) -->
  <circle cx="180" cy="180" r="140" fill="#00f2fe" opacity="0.05" class="pulse-glow" />
  <circle cx="1020" cy="190" r="160" fill="#00ff87" opacity="0.04" class="pulse-glow" />

  <!-- Dynamic Twinkling Data Points -->
  <circle cx="140" cy="90" r="3" fill="#00f2fe" class="particle-anim1" />
  <circle cx="280" cy="320" r="3" fill="#00ff87" class="particle-anim2" />
  <circle cx="920" cy="80" r="3.5" fill="#60efff" class="particle-anim1" />
  <circle cx="1080" cy="320" r="2.5" fill="#00f2fe" class="particle-anim2" />
  <circle cx="600" cy="40" r="2.5" fill="#4facfe" class="particle-anim1" />

  <!-- Foreground Title and Hero Content (Always in Foreground) -->
  <!-- Top Category Tag -->
  <g transform="translate(425, 42)">
    <rect width="350" height="32" rx="16" fill="#0e223f" stroke="#00f2fe" stroke-width="1.2" />
    <circle cx="20" cy="16" r="4.5" fill="#00ff87" />
    <text x="36" y="21" fill="#60efff" font-size="12" class="badge-label">CYBERSECURITY LABS &amp; REVERSE ENGINEERING</text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="132" text-anchor="middle" fill="#ffffff" font-size="40" class="brand-title">
    Cybersecurity Training &amp; Reverse Engineering
  </text>
  
  <text x="600" y="172" text-anchor="middle" fill="url(#neonGreen)" font-size="18" font-weight="700" class="brand-subtitle" letter-spacing="1">
    ENTERPRISE CYBER RANGES &bull; DYNAMIC DECOMPILERS &bull; ACTIVE THREAT LABS
  </text>

  <!-- Subtitle Narrative -->
  <text x="600" y="206" text-anchor="middle" fill="#94a3b8" font-size="15" class="brand-subtitle">
    Curated SaaS Platforms, Self-Hosted Labs, Malware Sandboxes, and Binary Toolchains
  </text>

  <!-- Dynamic Feature Cards (Bottom Area, Solidly in Foreground) -->
  <g transform="translate(110, 246)">
    <!-- Card 1: Cyber Ranges -->
    <g transform="translate(0, 0)" class="card-float1">
      <rect width="225" height="78" rx="10" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />
      <rect x="14" y="20" width="38" height="38" rx="8" fill="#091b30" />
      <text x="33" y="45" text-anchor="middle" font-size="18">&#x1F6E1;&#xFE0F;</text>
      <text x="64" y="38" fill="#ffffff" font-size="14" font-weight="700" class="brand-title">Cyber Ranges</text>
      <text x="64" y="55" fill="#7dd3fc" font-size="11" class="brand-subtitle">Live-Fire SOC &amp; Blue Team</text>
    </g>

    <!-- Card 2: Reverse Engineering -->
    <g transform="translate(250, 0)" class="card-float2">
      <rect width="225" height="78" rx="10" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />
      <rect x="14" y="20" width="38" height="38" rx="8" fill="#091b30" />
      <text x="33" y="45" text-anchor="middle" font-size="18">&#x26A1;</text>
      <text x="64" y="38" fill="#ffffff" font-size="14" font-weight="700" class="brand-title">Reverse Eng.</text>
      <text x="64" y="55" fill="#7dd3fc" font-size="11" class="brand-subtitle">Ghidra &bull; x64dbg &bull; Radare2</text>
    </g>

    <!-- Card 3: Hands-On Labs -->
    <g transform="translate(500, 0)" class="card-float1">
      <rect width="225" height="78" rx="10" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />
      <rect x="14" y="20" width="38" height="38" rx="8" fill="#091b30" />
      <text x="33" y="45" text-anchor="middle" font-size="18">&#x1F3AF;</text>
      <text x="64" y="38" fill="#ffffff" font-size="14" font-weight="700" class="brand-title">Hands-On Labs</text>
      <text x="64" y="55" fill="#7dd3fc" font-size="11" class="brand-subtitle">HTB &bull; OffSec &bull; CTFd</text>
    </g>

    <!-- Card 4: Threat Simulation & DFIR -->
    <g transform="translate(750, 0)" class="card-float2">
      <rect width="225" height="78" rx="10" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />
      <rect x="14" y="20" width="38" height="38" rx="8" fill="#091b30" />
      <text x="33" y="45" text-anchor="middle" font-size="18">&#x1F52C;</text>
      <text x="64" y="38" fill="#ffffff" font-size="14" font-weight="700" class="brand-title">Emulation &amp; DFIR</text>
      <text x="64" y="55" fill="#7dd3fc" font-size="11" class="brand-subtitle">CALDERA &bull; Volatility &bull; capa</text>
    </g>
  </g>

  <!-- Bottom Border Strip -->
  <g transform="translate(0, 385)">
    <line x1="50" y1="0" x2="1150" y2="0" stroke="#1d2d50" stroke-width="1" />
    <text x="600" y="20" text-anchor="middle" fill="#64748b" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
      &#x1F512; Open-Source Verified &bull; Industry-Standard SaaS &bull; Continuously Curated &bull; MITRE ATT&amp;CK Mapped
    </text>
  </g>
</svg>
